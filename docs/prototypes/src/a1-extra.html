<style>
/* Agent-only pieces */
.toppill{position:absolute;z-index:4;top:14px;left:50%;transform:translateX(-50%);height:44px;padding:0 18px;border-radius:999px;border:none;background:var(--ink);color:var(--on-ink);font-weight:800;font-size:18px;letter-spacing:-.01em;box-shadow:var(--sh-2);display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.toppill small{font-size:12px;font-weight:600;opacity:.7}
.avbtn{position:absolute;z-index:4;top:14px;left:var(--gl);width:44px;height:44px;border-radius:50%;border:none;padding:0;background:var(--surface);box-shadow:var(--sh-2);overflow:hidden}
.avbtn .av{width:44px;height:44px}
.gobtn{position:absolute;z-index:4;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;border:none;background:var(--blue);color:#FFFFFF;font-weight:800;font-size:22px;letter-spacing:.02em;box-shadow:0 0 0 8px rgb(39 110 241 / .2),var(--sh-2);transition:transform .15s}
.gobtn:active{transform:translateX(-50%) scale(.94)}
.statline{display:flex;align-items:center;gap:10px}
.statline .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dotst{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ink-3)}
.dotst.on{background:var(--brand-2);animation:ping 1.6s infinite}
.tierrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:none;width:100%;text-align:left}
.tierrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tierrow b{font-size:15px}
.medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#7A4B26;color:#FFE3C4;flex:none;font-weight:800;font-size:13px}
.bar1{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar1 span{display:block;height:100%;background:var(--ink);border-radius:3px}
.job{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;border:none;background:transparent;text-align:left;position:relative}
.job + .job::before{content:"";position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.job .thumb{width:52px;height:52px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.job .thumb > span{width:70%;height:70%;display:block}
.job .thumb svg{width:100%;height:100%}
.job .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.job b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job small{font-size:13.5px;color:var(--ink-3)}
.job .fee{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.job .tags{display:flex;gap:6px;flex-wrap:wrap}
.reqhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.countdown{position:relative;width:56px;height:56px;flex:none}
.countdown svg{transform:rotate(-90deg)}
.countdown b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.bigfee{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.stoplist{display:grid;grid-template-columns:20px 1fr auto;gap:4px 12px;align-items:center}
.stoplist .rail{width:2px;height:22px;margin-left:5px;background:var(--ink)}
.stoplist b{font-size:15.5px}
.stoplist small{display:block;font-size:13px;color:var(--ink-3)}
.stoplist .km{font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.capgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.capt{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:14px;border:2px dashed var(--line-2);background:var(--bg-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;text-align:center;font-weight:700;font-size:14px;color:var(--ink);overflow:hidden}
.capt small{font-weight:500;font-size:12px;color:var(--ink-3)}
.capt.done{border:none;padding:0;background:var(--surface-2)}
.capt.done .shot{position:absolute;inset:0}
.capt.done .shot svg{width:100%;height:100%;display:block}
.capt .ok{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--brand-2);color:#FFFFFF;display:grid;place-items:center}
.capt .retake{position:absolute;left:8px;bottom:8px;height:30px;padding:0 10px;border-radius:999px;background:rgb(0 0 0 / .65);color:#FFFFFF;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.lineedit{display:grid;grid-template-columns:1fr 104px;gap:8px}
.lineedit input{height:48px;border-radius:10px;border:2px solid transparent;background:var(--surface-2);padding:0 12px;min-width:0;font-size:15px;outline:none}
.lineedit input:focus{border-color:var(--ink);background:var(--surface)}
.lineedit input.amtin{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.cam{position:absolute;inset:0;z-index:20;background:#000;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px var(--gr) 28px var(--gl);animation:fade .2s}
.cam .top{width:100%;display:flex;align-items:center;justify-content:space-between}
.cam .top .ib{color:#FFFFFF}
.cam .vf{position:relative;width:100%;max-width:340px;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:#151515}
.cam .vf .shot{position:absolute;inset:0;transition:opacity .3s}
.cam .vf .shot svg{width:100%;height:100%;display:block}
.cam .vf.live .shot{opacity:.55}
.cam .guide{position:absolute;inset:14%;border:2px solid rgb(255 255 255 / .8);border-radius:12px;pointer-events:none}
.cam .chipc{color:#FFFFFF;position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;background:rgb(0 0 0 / .6);font-size:12.5px;font-weight:600}
.cam p{margin:0;color:#BDBDBD;font-size:13.5px;text-align:center}
.cam .btnw{height:52px;padding:0 22px;border-radius:10px;border:none;font-weight:700;font-size:16px;background:rgb(255 255 255 / .14);color:#FFFFFF}
.cam .btnw.pri{background:#FFFFFF;color:#000000}
.selfie{position:absolute;inset:0;z-index:20;background:#000;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px var(--gr) 28px var(--gl);text-align:center;animation:fade .2s}
.selfie .ib{color:#FFFFFF;align-self:flex-start}
.selfie p{margin:0;color:#BDBDBD}
.oval{width:220px;height:290px;border-radius:50%;border:3px dashed #FFFFFF;display:grid;place-items:center;color:#FFFFFF;transition:border-color .3s,background .3s}
.oval.ok{border-style:solid;border-color:#3DD68C;color:#3DD68C;background:rgb(61 214 140 / .1)}
.pinbox{display:grid;grid-template-columns:repeat(4,58px);gap:10px;justify-content:center}
.pinbox span{height:66px;border-radius:12px;background:var(--surface-2);border:2px solid transparent;display:grid;place-items:center;font-size:32px;font-weight:800}
.pinbox span.on{border-color:var(--ink)}
.pinbox.err span{border-color:var(--danger);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:330px;margin:0 auto}
.keys button{height:62px;border-radius:12px;border:none;background:var(--surface-2);font-size:26px;font-weight:700;color:var(--ink);display:grid;place-items:center;transition:transform .1s}
.keys button:active{transform:scale(.95)}
.keys .ghost{background:transparent}
.errtxt{margin:0;min-height:20px;text-align:center;color:var(--danger);font-size:14px;font-weight:600}
.timer{position:relative;width:210px;height:210px;margin:0 auto}
.timer svg{transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer b{font-size:48px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:168px}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart .val{font-size:11px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chart .cbar{display:block;width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:var(--surface-3)}
.chart .cbar.today{background:var(--ink)}
.chart .cbar.future{background:var(--line)}
.chart .day{font-size:12px;font-weight:700;color:var(--ink-3)}
.chart .day.today{color:var(--ink)}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .mh{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.meter .mh b{color:var(--ink);font-variant-numeric:tabular-nums}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;border:2px solid var(--line-2);background:var(--surface);text-align:left;width:100%}
.opt[aria-checked="true"]{border-color:var(--ink)}
.opt .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.opt b{font-size:16px}
.opt small{font-size:13px;color:var(--ink-3)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--ink)}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.earnbox{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:16px;background:var(--ink);color:var(--on-ink)}
.earnbox small{font-size:13.5px;opacity:.75}
.earnbox .bal{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.earnbox .btn{align-self:flex-start;background:var(--on-ink);color:var(--ink);height:44px;border-radius:999px}
.earnbox .pend{display:flex;justify-content:space-between;font-size:14px;opacity:.85;border-top:1px solid rgb(127 127 127 / .35);padding-top:10px}
.prefrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.prefrow.plain{background:transparent;padding:10px 0;border-radius:0}
.prefrow.plain + .prefrow.plain{border-top:1px solid var(--line)}
.prefrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.prefrow b{font-size:15.5px;font-weight:600}
.prefrow small{font-size:13px;color:var(--ink-3)}
.hiddenrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:none;border-radius:12px;background:var(--surface-2);text-align:left;color:var(--ink)}
.hiddenrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:14.5px;font-weight:600}
.hiddenrow small{font-size:13px;font-weight:500;color:var(--ink-3)}
</style>
