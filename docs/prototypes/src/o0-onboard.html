<style>
/* Sign-up and log in: shared by both apps. One question per screen, grey filled inputs, black Continue. */
.ob{position:absolute;inset:0;z-index:12;background:var(--bg);display:flex;flex-direction:column;animation:slidein .3s var(--ease)}
.obhead{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px var(--gr) 0 calc(var(--gl) - 6px);flex:none}
.obprog{flex:1;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-right:6px}
.obprog i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .4s var(--ease)}
.obbody{flex:1;overflow-y:auto;padding:8px var(--gr) 20px var(--gl);display:flex;flex-direction:column;gap:18px}
.obbody > *{flex-shrink:0}
.obq{margin:0;font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.obfoot{flex:none;padding:12px var(--gr) 18px var(--gl);display:flex;flex-direction:column;gap:8px}
.obfoot .note{text-align:center}
.tel{display:flex;gap:8px}
.ccode{display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 12px;border-radius:10px;background:var(--surface-2);border:none;font-weight:600;font-size:16px;flex:none}
.flag{width:22px;height:15px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgb(0 0 0 / .14)}
.tin{width:100%;min-width:0;height:54px;border-radius:10px;border:2px solid transparent;background:var(--surface-2);padding:0 14px;font-size:17px;font-weight:600;outline:none;transition:border-color .15s,background .15s}
.tel .tin{flex:1;letter-spacing:.03em}
.tin:focus{border-color:var(--ink);background:var(--surface)}
.tin::placeholder{color:var(--ink-3);font-weight:500}
.fgroup{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:14px;font-weight:600;color:var(--ink-2)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;cursor:text}
.otp span{height:60px;border-radius:10px;background:var(--surface-2);border:2px solid transparent;display:grid;place-items:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.otp span.on{border-color:var(--ink);background:var(--surface)}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:none}
.autofill{align-self:center;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:none;background:var(--surface-2);font-weight:600;font-size:14.5px;animation:pop .35s var(--ease)}
.tickrow{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;color:var(--ink-2);line-height:1.45}
.cbox{width:24px;height:24px;border-radius:6px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--on-ink);padding:0;margin-top:-1px}
.cbox[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.waiting{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.waiting .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.waiting b{font-size:15px}
.waiting small{font-size:13px;color:var(--ink-3)}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--ink);animation:spin .9s linear infinite;flex:none;display:inline-block}
.spinner.sm{width:16px;height:16px;border-width:2.5px}
.spinner.light{width:40px;height:40px;border-width:4px;border-color:rgb(255 255 255 / .25);border-top-color:#FFFFFF}
@keyframes spin{to{transform:rotate(360deg)}}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #FFFFFF;background:transparent;display:grid;place-items:center}
.shutter span{width:60px;height:60px;border-radius:50%;background:#FFFFFF;display:block;transition:transform .12s}
.shutter:active span{transform:scale(.9)}
.facecam{position:absolute;inset:0;z-index:20;background:#000;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px var(--gr) 32px var(--gl);text-align:center;animation:fade .2s}
.facecam .ib{color:#FFFFFF;align-self:flex-start}
.facecam.sdk{background:#0B0F0D}
.sdkbadge{position:absolute;top:22px;right:var(--gr);display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;background:rgb(255 255 255 / .12);color:#D9D9D9;font-size:12px;font-weight:600}
.facecam .ib:hover{background:rgb(255 255 255 / .12)}
.facecam h1{color:#FFFFFF}
.facecam p{margin:0;color:#BDBDBD;font-size:14.5px;max-width:300px}
.faceoval{width:232px;height:300px;border-radius:50%;border:3px dashed rgb(255 255 255 / .85);display:grid;place-items:center;overflow:hidden;color:#FFFFFF;transition:border-color .3s}
.faceoval.ok{border-style:solid;border-color:#3DD68C}
.faceoval .av{width:100%;height:100%;border-radius:0}
.okdot{width:64px;height:64px;border-radius:50%;background:#3DD68C;color:#03140A;display:grid;place-items:center;animation:pop .4s var(--ease)}
.ckl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ckl li{display:flex;align-items:center;gap:12px;min-height:52px;font-size:15.5px;font-weight:600;color:var(--ink-3);transition:color .2s}
.ckl li + li{border-top:1px solid var(--line)}
.ckl li.done,.ckl li.now{color:var(--ink)}
.ckl li.warn{color:var(--urgent)}
.ckd{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.ckl li.done .ckd{background:var(--brand-2);color:var(--on-brand)}
.ckl li.warn .ckd{background:var(--urgent-soft);color:var(--urgent)}
/* Welcome */
.welcome{background:var(--bg)}
.wtop{position:relative;flex:1;min-height:0;background:#0A0A0A;color:#FFFFFF;overflow:hidden;display:flex;flex-direction:column;padding:22px var(--gr) 0 var(--gl)}
.wtop::after{content:"";position:absolute;left:-30%;right:-30%;bottom:-160px;height:260px;border-radius:50%;background:radial-gradient(closest-side,rgb(61 214 140 / .28),transparent)}
.brandline{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em;position:relative;z-index:1}
.brandline .glyph{background:#FFFFFF;color:#000000;width:34px;height:34px;border-radius:10px}
.brandline .appic{width:40px;height:40px}
.brandline .wm{height:30px;color:#FFFFFF}
.brandline .wm .acc{fill:#3DD68C}
.brandline .appic svg{border-radius:22.5%;box-shadow:0 0 0 1px rgb(255 255 255 / .18)}
.brandline small{font-size:13px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgb(255 255 255 / .14);letter-spacing:0}
.collage{position:relative;flex:1;z-index:1}
.collage .cc{position:absolute;width:132px;height:132px;border-radius:28px;background:#1C1C1C;display:grid;place-items:center;box-shadow:0 18px 40px rgb(0 0 0 / .45)}
.collage .cc > span{width:72%;height:72%;display:block}
.collage .cc svg{width:100%;height:100%}
.collage .c0{left:6%;top:16%;transform:rotate(-8deg)}
.collage .c1{right:6%;top:9%;transform:rotate(7deg)}
.collage .c2{left:16%;bottom:8%;transform:rotate(5deg)}
.collage .c3{right:12%;bottom:15%;transform:rotate(-6deg)}
.jobcards{position:relative;flex:1;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:8px 0 28px}
.jc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#1C1C1C;box-shadow:0 14px 30px rgb(0 0 0 / .4)}
.jc:nth-child(1){margin-right:18px;transform:rotate(-2deg)}
.jc:nth-child(2){margin-left:18px;transform:rotate(1.5deg)}
.jc:nth-child(3){margin-right:8px;transform:rotate(-1deg)}
.jc .ico{background:#2B2B2B;color:#FFFFFF}
.jc .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.jc b{font-size:15px}
.jc small{font-size:12.5px;color:#A6A6A6}
.jc .fee{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.wbot{flex:none;padding:24px var(--gr) 22px var(--gl);display:flex;flex-direction:column;gap:12px}
.wbot .sub{margin-bottom:6px}
.perks{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:10px}
.perks li{display:flex;align-items:center;gap:12px;font-size:15.5px;font-weight:600}
.perks .ico{width:34px;height:34px}
/* Agent application checklist and slides */
.steprow .badge{flex:none}
.slide{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:18px 6px 0;animation:slidein .3s var(--ease)}
.slide .big{width:104px;height:104px;border-radius:30px;background:var(--surface-2);display:grid;place-items:center}
.slide p{margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.5;max-width:320px}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--surface-3);transition:width .25s var(--ease),background .25s}
.dots i.on{width:22px;background:var(--ink)}
.terms{list-style:none;margin:0;padding:16px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:12px}
.terms li{display:flex;gap:10px;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.terms li svg{margin-top:2px;color:var(--ink)}
.lookup{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--brand-soft);animation:pop .3s var(--ease)}
.lookup .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.lookup b{font-size:15px;letter-spacing:.02em}
.lookup small{font-size:13px;color:var(--brand-ink);font-weight:600}
.addcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:none;background:var(--brand-soft);width:100%;text-align:left;color:var(--ink);animation:rise .4s var(--ease)}
.addcard .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.addcard b{font-size:15.5px}
.addcard small{font-size:13px;color:var(--ink-2)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 12px;text-align:center}
.empty .ico{width:56px;height:56px}
.idshot{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:76px;padding:12px 14px;border-radius:12px;border:2px dashed var(--line-2);background:var(--bg-2);text-align:left;color:var(--ink);overflow:hidden}
.idshot .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.idshot b{font-size:15.5px}
.idshot small{font-size:13px;color:var(--ink-3)}
.idshot.done{border:none;padding:0;height:150px;background:var(--surface-2)}
.idshot .pic{position:absolute;inset:0}
.idshot .pic svg{width:100%;height:100%;display:block}
.idshot .ok{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--brand-2);color:#FFFFFF;display:grid;place-items:center}
.idshot .retake{position:absolute;left:10px;bottom:10px;height:30px;padding:0 10px;border-radius:999px;background:rgb(0 0 0 / .66);color:#FFFFFF;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg2 button{height:40px;border:none;border-radius:9px;background:transparent;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
</style>
