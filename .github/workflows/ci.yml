name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read the code, nothing more (docs/security-plan.md, S10).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: jiffo
          POSTGRES_PASSWORD: jiffo
          POSTGRES_DB: jiffo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiffo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://jiffo:jiffo@localhost:5432/jiffo
      REDIS_URL: redis://localhost:6379

    steps:
      # Actions are pinned to a commit, not a tag that can be moved; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit what the apps ship
        # Fails on a high or critical advisory, except those accepted in pnpm-workspace.yaml with a reason.
        run: pnpm audit --prod --audit-level=high
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build both apps for web
        run: pnpm --filter @jiffo/mobile export:web
      - name: Migrations match the schema
        working-directory: apps/api
        run: |
          pnpm exec drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "src/db/schema.ts has changes with no migration. Run pnpm --filter @jiffo/api db:generate and commit the result."
            git status --porcelain drizzle
            exit 1
          fi
