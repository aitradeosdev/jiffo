# Secret scanning (docs/security-plan.md, S2): gitleaks' own rules. A real-looking key anywhere, tests and
# example files included, fails the Security run. A made-up key a test needs is marked on its own line with a
# `gitleaks:allow` comment; a finding already in the history that was checked goes in .gitleaksignore.
[extend]
useDefault = true

[[allowlists]]
description = "Made-up keys in tests"
condition = "AND"
paths = [
  '''(^|/)test/''',
  '''\.test\.tsx?$''',
]
regexTarget = "match"
regexes = ['''(?i)(test|fake|example|dummy)''']
