# Local services for development and tests: Postgres with PostGIS, and Redis.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: jiffo
      POSTGRES_PASSWORD: jiffo
      POSTGRES_DB: jiffo
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jiffo']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  postgres-data:
