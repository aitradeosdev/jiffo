packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

# No advisories are accepted: CI fails on any high or critical one in what the apps ship. To accept one for a
# while, list it under auditConfig.ignoreGhsas here and allow-ghsas in security.yml, with its reason in
# docs/security/dependencies.md.

# Changes to packages, each with its reason in docs/security/dependencies.md.
patchedDependencies:
  # Smile ID's camera glue applies the Kotlin plugin only below AGP 9, but Expo 58 apps turn AGP 9's built-in
  # Kotlin off, so the agent app's Android build stopped (MB7).
  '@smileid/kamera@1.2.0': patches/@smileid__kamera@1.2.0.patch
  # Smile ID's React Native bridge has the same Android namespace as the library it wraps, which AGP 9 refuses,
  # so the agent app's Android build stopped (MB7).
  '@smileid/usesmileid_bridge@12.3.0': patches/@smileid__usesmileid_bridge@12.3.0.patch
  # A failed query's message names the database's reason and the query, not the values sent with it, which
  # would otherwise reach the logs (R10, S7).
  drizzle-orm@0.45.4: patches/drizzle-orm@0.45.4.patch
