packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

# Advisories accepted for now, each with its reason in docs/security/dependencies.md. CI fails on any other
# high or critical advisory in what the apps ship.
auditConfig:
  ignoreGhsas:
    # zod < 4.6.6: oversized collections can exhaust memory. Request bodies are capped in size. zod 4 is a
    # major upgrade, planned.
    - GHSA-mrhx-c7xc-m3w5

# Changes to packages, each with its reason in docs/security/dependencies.md.
patchedDependencies:
  # A failed query's message names the database's reason and the query, not the values sent with it, which
  # would otherwise reach the logs (R10, S7).
  drizzle-orm@0.45.4: patches/drizzle-orm@0.45.4.patch
