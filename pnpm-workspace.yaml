packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

# No advisories are accepted: CI fails on any high or critical one in what the apps ship. To accept one for a
# while, list it under auditConfig.ignoreGhsas here and allow-ghsas in security.yml, with its reason in
# docs/security/dependencies.md.

# Changes to packages, each with its reason in docs/security/dependencies.md.
patchedDependencies:
  # A failed query's message names the database's reason and the query, not the values sent with it, which
  # would otherwise reach the logs (R10, S7).
  drizzle-orm@0.45.4: patches/drizzle-orm@0.45.4.patch
