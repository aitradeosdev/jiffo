plugins {
  id 'com.android.library'
  // Sets the SDK versions, Kotlin and Expo's own dependencies, as Expo 58's modules do.
  id 'expo-module-gradle-plugin'
}

group = 'com.jiffo.devicekey'
version = '1.0.0'

android {
  namespace "com.jiffo.devicekey"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}
